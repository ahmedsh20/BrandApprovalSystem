{% extends "base.html" %}

{% block title %}
Post Feedback
{% endblock %}

{% block navbar %}

<a class="nav-link text-white" href="{{ url_for('my_requests') }}">
    ⬅ <span class="nav-text">Back</span>
</a>

<a class="nav-link text-white" href="/">
    🏠 <span class="nav-text">Home</span>
</a>

<a class="nav-link text-white" href="/register">
    📝 <span class="nav-text">Register</span>
</a>

<a class="nav-link text-white" href="/login">
    🔐 <span class="nav-text">Admin Login</span>
</a>

{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-sm-11 col-md-9 col-lg-7">

        <div class="card shadow">

            <div class="card-body p-4 p-md-5">

                <h2 class="text-center mb-2">

                    Post Feedback

                </h2>

                <p class="text-center mb-4">

                    Brand:
                    <strong class="text-warning">{{ submission.brand_name }}</strong>

                </p>

                {% if error %}

                <div class="alert alert-danger text-center">

                    {{ error }}

                </div>

                {% endif %}

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label" for="message">

                            Your feedback

                        </label>

                        <textarea
                            class="form-control"
                            id="message"
                            name="message"
                            rows="7"
                            maxlength="{{ max_length }}"
                            placeholder="Write your feedback about this brand here..."
                            required>{{ message }}</textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100">

                        Submit Feedback

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
